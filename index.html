<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌀 TANZ · SHOW.live · KRIECHEN → STEHEN · GENERAL</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background: #0a0a0f;
  color: #c8d0d0;
  font-family: 'Consolas', monospace;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
  background: radial-gradient(ellipse at 50% 50%, #0a0a1a, #000000);
}
.container {
  max-width: 1200px;
  width: 100%;
  background: rgba(10,10,20,0.3);
  border: 1px solid rgba(255,170,0,0.03);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(10px);
}
.header {
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  padding-bottom: 10px;
  margin-bottom: 12px;
}
.header h1 {
  font-size: 24px;
  background: linear-gradient(90deg, #ff4444, #ffaa00, #00ff88, #00ccff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 4px;
}
.header .sub {
  color: #445555;
  font-size: 10px;
  letter-spacing: 3px;
}
.header .sub .gen { color: #ffaa00; }

.main-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
}
@media (max-width:800px){ .main-grid { grid-template-columns:1fr; } }

.canvas-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: rgba(0,0,0,0.4);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.02);
  overflow: hidden;
}
#tanzCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

.panel {
  background: rgba(10,10,20,0.2);
  border: 1px solid rgba(255,255,255,0.02);
  border-radius: 12px;
  padding: 12px;
}
.panel h3 {
  font-size: 10px;
  color: #ffaa00;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  padding-bottom: 4px;
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.status-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  margin: 6px 0;
}
.status-item {
  background: rgba(0,0,0,0.2);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 9px;
  display: flex;
  justify-content: space-between;
}
.status-item .label { color: #445555; }
.status-item .value.on { color: #00ff88; }
.status-item .value.off { color: #445555; }
.status-item .value.pulse { color: #ff66ff; animation: pulse 0.8s infinite; }
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

.move-bar {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin: 6px 0;
}
.move-btn {
  background: rgba(20,35,35,0.2);
  color: #668888;
  border: 1px solid rgba(255,255,255,0.02);
  padding: 4px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-family: inherit;
  font-size: 9px;
  transition: all 0.2s;
}
.move-btn:hover { background: rgba(40,80,70,0.08); color: #aaeedd; }
.move-btn.active { border-color: #ffaa0066; color: #ffaa00; background: rgba(255,170,0,0.05); }

.controls {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin: 6px 0;
}
.controls button {
  background: rgba(20,35,35,0.2);
  color: #668888;
  border: 1px solid rgba(255,255,255,0.02);
  padding: 4px 12px;
  border-radius: 14px;
  cursor: pointer;
  font-family: inherit;
  font-size: 8px;
  transition: all 0.2s;
}
.controls button:hover { background: rgba(40,80,70,0.08); color: #aaeedd; }
.controls button.primary { border-color: #ffaa0066; color: #ffaa00; }
.controls button.primary:hover { background: rgba(255,170,0,0.05); }
.controls button.recall { border-color: #00ccff66; color: #00ccff; }
.controls button.recall:hover { background: rgba(0,204,255,0.05); }

.log {
  background: rgba(0,0,0,0.3);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 7px;
  color: #445555;
  max-height: 80px;
  overflow-y: auto;
  font-family: monospace;
  line-height: 1.5;
  margin-top: 6px;
  border: 1px solid rgba(255,255,255,0.01);
}
.log .hl { color: #7fc9ff; }
.log .ok { color: #00ff88; }
.log .flow { color: #ffaa00; }
.log .whirl { color: #ff66ff; }
.log .gen { color: #ffd700; }

.footer {
  text-align: center;
  margin-top: 10px;
  color: #1a1a2a;
  font-size: 7px;
  letter-spacing: 2px;
}
.footer span { color: #ffaa00; }
</style>
</head>
<body>

<div class="container">

<div class="header">
  <h1>🌀 TANZ · SHOW.live · GENERAL</h1>
  <div class="sub">KRIECHEN → STEHEN · <span class="gen">RECALL</span> · SHUFFLE · DREH</div>
</div>

<div class="main-grid">

  <!-- CANVAS -->
  <div class="canvas-wrap">
    <canvas id="tanzCanvas"></canvas>
  </div>

  <!-- PANEL -->
  <div class="panel">
    <h3>🎯 GENERAL · MOVE</h3>

    <div class="status-grid">
      <div class="status-item"><span class="label">🔴 P1</span><span class="value on" id="p1Status">5</span></div>
      <div class="status-item"><span class="label">🔵 P2</span><span class="value on" id="p2Status">c</span></div>
      <div class="status-item"><span class="label">🎯 MOVE</span><span class="value pulse" id="moveStatus">—</span></div>
      <div class="status-item"><span class="label">🔄 DREH</span><span class="value" id="spinStatus">0°</span></div>
      <div class="status-item"><span class="label">🔀 SHUFFLE</span><span class="value off" id="shuffleStatus">AUS</span></div>
      <div class="status-item"><span class="label">⏪ RECALL</span><span class="value" id="recallStatus">0</span></div>
    </div>

    <div class="move-bar">
      <span style="font-size:7px;color:#445555;margin-right:4px;">POSEN:</span>
      <button class="move-btn" data-pose="1">1</button>
      <button class="move-btn" data-pose="2">2</button>
      <button class="move-btn" data-pose="3">3</button>
      <button class="move-btn" data-pose="4">4</button>
      <button class="move-btn" data-pose="5">5</button>
      <button class="move-btn" data-pose="6">6</button>
      <button class="move-btn" data-pose="7">7</button>
      <button class="move-btn" data-pose="8">8</button>
      <button class="move-btn" data-pose="9">9</button>
      <button class="move-btn" data-pose="c">C</button>
      <button class="move-btn" data-pose="z">Z</button>
    </div>

    <div class="controls">
      <button class="primary" id="btnGeneral">⬆ GENERAL · KRIECHEN→STEHEN</button>
      <button id="btnShuffle">🔀 SHUFFLE</button>
      <button id="btnSpin">🔄 DREH</button>
      <button class="recall" id="btnRecall">⏪ RECALL</button>
      <button id="btnReset">⟲ RESET</button>
    </div>

    <div class="log" id="log">[🌀] TANZ · SHOW.live · GENERAL · bereit</div>
  </div>

</div>

<div class="footer">🌀 TANZ · SHOW.live · GENERAL · <span>wieimmer4u</span></div>

</div>

<script>
// ================================================================
// TANZ · SHOW.live · GENERAL · KRIECHEN → STEHEN
// ================================================================

// ─── CANVAS ──────────────────────────────────────────────────────
const canvas = document.getElementById('tanzCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width || 700;
  canvas.height = rect.height || (rect.width * 9/16) || 390;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ─── POSEN ──────────────────────────────────────────────────────
const POSES = {
  '1': { armL:-0.6, armR:-0.4, legL:-0.3, legR:-0.1, body:0, head:0, label:'Step L' },
  '2': { armL:-0.4, armR:-0.6, legL:-0.1, legR:-0.3, body:0.05, head:0.05, label:'Step R' },
  '3': { armL:-0.8, armR:0.3, legL:-0.4, legR:0.1, body:0.1, head:0.1, label:'Arm L' },
  '4': { armL:0.3, armR:-0.8, legL:0.1, legR:-0.4, body:0.15, head:0.15, label:'Arm R' },
  '5': { armL:0.6, armR:0.6, legL:0, legR:0, body:0.2, head:0.2, label:'Stehen' },
  '6': { armL:-0.9, armR:0.9, legL:-0.3, legR:0.3, body:0.25, head:0.25, label:'Spread' },
  '7': { armL:0, armR:0, legL:-0.6, legR:0.6, body:0.3, head:0.3, label:'Split' },
  '8': { armL:0.5, armR:-0.5, legL:-0.3, legR:-0.3, body:0.35, head:0.35, label:'Twist' },
  '9': { armL:-0.3, armR:0.3, legL:0.3, legR:-0.3, body:0.4, head:0.4, label:'Spin' },
  'q': { armL:-0.5, armR:-0.5, legL:-0.2, legR:-0.2, body:0.02, head:0.02, label:'Sway L' },
  'w': { armL:0.5, armR:0.5, legL:0.2, legR:0.2, body:0.08, head:0.08, label:'Sway R' },
  'e': { armL:-0.7, armR:0.15, legL:-0.35, legR:0.05, body:0.12, head:0.12, label:'Wave L' },
  'a': { armL:0.15, armR:-0.7, legL:0.05, legR:-0.35, body:0.18, head:0.18, label:'Wave R' },
  'z': { armL:0.7, armR:-0.3, legL:0.15, legR:-0.15, body:0.22, head:0.22, label:'Kriechen' },
  'd': { armL:-0.3, armR:0.7, legL:-0.15, legR:0.15, body:0.28, head:0.28, label:'Grace' },
  'y': { armL:0.3, armR:0.3, legL:-0.4, legR:0.4, body:0.32, head:0.32, label:'Float' },
  'x': { armL:-0.6, armR:-0.6, legL:0.4, legR:-0.4, body:0.38, head:0.38, label:'Cross' },
  'c': { armL:0, armR:0, legL:0, legR:0, body:0, head:0, label:'Center' }
};

// ─── STATE ──────────────────────────────────────────────────────
let p1 = { x: 0.30, y: 0.55, pose: 'z', color: '#ff4444', rot: 0 };
let p2 = { x: 0.70, y: 0.55, pose: 'c', color: '#00ccff', rot: 0 };
let currentMove = '—';
let p1Score = 0, p2Score = 0;
let spinAngle = 0, spinSpeed = 0;
let shuffleMode = false;
let recallCount = 0;
let running = true;
let frame = 0;
let time = 0;

// ─── RECALL ─────────────────────────────────────────────────────
let history = [];
const MAX_HISTORY = 50;

function saveState() {
  history.push({
    p1: { pose: p1.pose, rot: p1.rot, x: p1.x, y: p1.y },
    p2: { pose: p2.pose, rot: p2.rot, x: p2.x, y: p2.y },
    p1Score, p2Score, currentMove, spinAngle, shuffleMode, spinSpeed
  });
  if (history.length > MAX_HISTORY) history.shift();
}

function recallState() {
  if (history.length === 0) { log('❌ kein Recall verfügbar', 'warn'); return false; }
  const last = history.pop();
  p1.pose = last.p1.pose; p1.rot = last.p1.rot; p1.x = last.p1.x; p1.y = last.p1.y;
  p2.pose = last.p2.pose; p2.rot = last.p2.rot; p2.x = last.p2.x; p2.y = last.p2.y;
  p1Score = last.p1Score; p2Score = last.p2Score;
  currentMove = last.currentMove;
  spinAngle = last.spinAngle;
  shuffleMode = last.shuffleMode;
  spinSpeed = last.spinSpeed;
  recallCount++;
  log(`⏪ RECALL #${recallCount} · zurückgesetzt`, 'recall');
  updateUI();
  return true;
}

// ─── GENERAL MOVE: KRIECHEN → STEHEN ──────────────────────────
function generalMove() {
  const steps = ['z', 'q', 'w', 'e', 'a', 'd', 'y', 'x', 'c', '5'];
  let i = 0;
  const interval = setInterval(() => {
    if (i >= steps.length) { clearInterval(interval); log('⬆ GENERAL · KRIECHEN → STEHEN abgeschlossen', 'gen'); return; }
    p1.pose = steps[i];
    currentMove = POSES[steps[i]]?.label || steps[i];
    log(`⬆ Schritt ${i+1}/${steps.length}: ${currentMove}`, 'flow');
    updateUI();
    i++;
  }, 300);
  log('⬆ GENERAL · KRIECHEN → STEHEN gestartet', 'gen');
}

// ─── STICKMAN ──────────────────────────────────────────────────
function drawStickman(ctx, x, y, pose, color, label, scale, alpha, rot) {
  const p = POSES[pose] || POSES['5'];
  const s = scale * 1.8;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot + p.body * 0.2);
  ctx.globalAlpha = alpha || 1;

  ctx.shadowColor = color + '55';
  ctx.shadowBlur = 25;
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(0, -s * 1.1 + p.head * 0.3 * s, s * 0.2, 0, Math.PI * 2);
  ctx.stroke();

  ctx.shadowBlur = 10;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.85 + p.body * 0.3 * s);
  ctx.lineTo(0, s * 0.25 + p.body * 0.3 * s);
  ctx.stroke();

  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.65 + p.body * 0.3 * s);
  ctx.lineTo(-s * 0.45 + p.armL * 0.5 * s, -s * 0.15 + p.body * 0.3 * s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.65 + p.body * 0.3 * s);
  ctx.lineTo(s * 0.45 + p.armR * 0.5 * s, -s * 0.15 + p.body * 0.3 * s);
  ctx.stroke();

  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.25 + p.body * 0.3 * s);
  ctx.lineTo(-s * 0.3 + p.legL * 0.6 * s, s * 0.7 + p.legL * 0.6 * s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, s * 0.25 + p.body * 0.3 * s);
  ctx.lineTo(s * 0.3 + p.legR * 0.6 * s, s * 0.7 + p.legR * 0.6 * s);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = color;
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(label, 0, -s * 1.5);

  ctx.globalAlpha = 0.3;
  ctx.font = '7px monospace';
  ctx.textBaseline = 'top';
  ctx.fillText(p.label || pose, 0, s * 1.0);
  ctx.restore();
}

// ─── RENDER ────────────────────────────────────────────────────
function render() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const grad = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, w/2);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(0.5, '#050510');
  grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(0, h * 0.8);
  ctx.lineTo(w, h * 0.8);
  ctx.stroke();

  if (shuffleMode) {
    for (let i = 0; i < 30; i++) {
      const x = (i / 30) * w;
      const y = h * 0.8 + Math.sin(i * 0.5 + time / 500) * 6;
      ctx.fillStyle = `rgba(255,170,0,${0.02 + Math.sin(i * 0.3 + time / 700) * 0.015})`;
      ctx.beginPath();
      ctx.arc(x, y, 2 + Math.sin(time / 400 + i) * 1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.fillStyle = '#ffaa0044';
  ctx.font = '14px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(`🎯 MOVE: ${currentMove}`, w/2, h * 0.82);

  ctx.fillStyle = '#ff444466';
  ctx.textAlign = 'left';
  ctx.fillText(`🔴 ${p1Score}`, 12, 10);
  ctx.fillStyle = '#00ccff66';
  ctx.textAlign = 'right';
  ctx.fillText(`🔵 ${p2Score}`, w - 12, 10);

  ctx.fillStyle = '#445555';
  ctx.textAlign = 'center';
  ctx.fillText(`🔄 ${Math.round(spinAngle)}° · RECALL ${recallCount}`, w/2, 4);

  const scale = Math.min(w, h) * 0.075;
  const p1x = w * p1.x, p1y = h * 0.7;
  const p2x = w * p2.x, p2y = h * 0.7;

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(p1x, h * 0.82, scale * 0.45, scale * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(p2x, h * 0.82, scale * 0.45, scale * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  drawStickman(ctx, p1x, p1y, p1.pose, p1.color, 'P1', scale, 1, p1.rot + spinAngle * 0.02);
  drawStickman(ctx, p2x, p2y, p2.pose, p2.color, 'P2', scale, 1, p2.rot + spinAngle * 0.02);

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.moveTo(p1x, p1y - scale * 1.2);
  ctx.lineTo(p2x, p2y - scale * 1.2);
  ctx.stroke();
  ctx.setLineDash([]);

  if (shuffleMode) {
    ctx.fillStyle = '#ffaa0044';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('🔀 SHUFFLE', w/2, h * 0.78);
  }
}

// ─── UPDATE ────────────────────────────────────────────────────
function updateUI() {
  document.getElementById('p1Status').textContent = p1.pose;
  document.getElementById('p2Status').textContent = p2.pose;
  document.getElementById('moveStatus').textContent = currentMove;
  document.getElementById('spinStatus').textContent = `${Math.round(spinAngle)}°`;
  document.getElementById('shuffleStatus').textContent = shuffleMode ? 'AN' : 'AUS';
  document.getElementById('shuffleStatus').className = 'value ' + (shuffleMode ? 'on' : 'off');
  document.getElementById('recallStatus').textContent = recallCount;
}

function log(msg, type = 'hl') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  const cls = ['hl','ok','flow','whirl','gen','recall','warn'].includes(type) ? type : 'hl';
  el.innerHTML += `<div>[${time}] <span class="${cls}">${msg}</span></div>`;
  el.scrollTop = el.scrollHeight;
  if (el.children.length > 30) el.removeChild(el.firstChild);
}

function update() {
  if (!running) return;
  time += 16;
  frame++;

  if (frame % 30 === 0) saveState();

  if (frame % 120 === 0) {
    const keys = Object.keys(POSES);
    currentMove = POSES[keys[Math.floor(Math.random() * keys.length)]]?.label || '—';
    updateUI();
  }

  if (frame % 8 === 0) {
    const keys1 = shuffleMode ? ['5','6','7','8','9','1','2','3','4'] : ['1','2','3','4','5','6','7','8','9'];
    p1.pose = keys1[Math.floor(Math.random() * keys1.length)];
    if (p1.pose === currentMove || Math.random() < 0.1) p1Score++;
    if (shuffleMode) p1.rot += (Math.random() - 0.5) * 0.05;

    const keys2 = shuffleMode ? ['y','x','c','q','w','e','a','z','d'] : ['q','w','e','a','z','d','y','x','c'];
    p2.pose = keys2[Math.floor(Math.random() * keys2.length)];
    if (p2.pose === currentMove || Math.random() < 0.1) p2Score++;
    if (shuffleMode) p2.rot += (Math.random() - 0.5) * 0.05;
    updateUI();
  }

  if (spinSpeed !== 0) {
    spinAngle += spinSpeed * 8;
    document.getElementById('spinStatus').textContent = `${Math.round(spinAngle)}°`;
  }

  render();
  requestAnimationFrame(update);
}

// ─── TASTATUR ──────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key >= '1' && key <= '9') { e.preventDefault(); p1.pose = key; updateUI(); }
  if (['q','w','e','a','z','d','y','x','c'].includes(key)) { e.preventDefault(); p2.pose = key; updateUI(); }
  if (key === 'g') { e.preventDefault(); generalMove(); }
  if (key === 'r') { e.preventDefault(); recallState(); }
  if (key === ' ') { e.preventDefault(); running = !running; document.getElementById('btnShuffle').textContent = running ? '▶ RUN' : '⏸ PAUSE'; }
});

// ─── BUTTONS ──────────────────────────────────────────────────
document.getElementById('btnGeneral').addEventListener('click', generalMove);
document.getElementById('btnShuffle').addEventListener('click', () => {
  shuffleMode = !shuffleMode;
  document.getElementById('btnShuffle').classList.toggle('active');
  log(shuffleMode ? '🔀 SHUFFLE AN' : '🔀 SHUFFLE AUS', 'flow');
  updateUI();
});
document.getElementById('btnSpin').addEventListener('click', () => {
  spinSpeed = spinSpeed === 0 ? 0.02 : spinSpeed === 0.02 ? 0.05 : 0;
  document.getElementById('btnSpin').classList.toggle('active');
  log(spinSpeed ? `🔄 DREH ${Math.round(spinSpeed*100)}%` : '🔄 DREH AUS', 'whirl');
});
document.getElementById('btnRecall').addEventListener('click', recallState);
document.getElementById('btnReset').addEventListener('click', () => {
  p1.pose = 'z'; p2.pose = 'c'; p1Score = 0; p2Score = 0;
  currentMove = '—'; spinAngle = 0; shuffleMode = false; spinSpeed = 0;
  recallCount = 0; history = [];
  document.getElementById('btnShuffle').classList.remove('active');
  document.getElementById('btnSpin').classList.remove('active');
  log('⟲ RESET', 'warn');
  updateUI();
});
